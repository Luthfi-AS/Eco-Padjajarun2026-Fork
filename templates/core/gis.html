  ["GOR / Hockey Venue", -6.92290, 107.77220],
,["Green Bazaar",-6.9237,107.7695]];points.forEach(p=>L.marker([p[1],p[2]]).addTo(map).bindPopup(p[0]));L.polyline(route, {

}).addTo(map).bindPopup("Rute Eco Run 5K");function useMyLocation(){if(!navigator.geolocation){document.getElementById('geo-status').innerText='Browser tidak mendukung geolocation.';return;}navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;L.marker([lat,lng]).addTo(map).bindPopup('Lokasi Anda').openPopup();map.setView([lat,lng],16);document.getElementById('geo-status').innerText=`Lokasi Anda: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;},()=>document.getElementById('geo-status').innerText='Izin lokasi ditolak.');}</script>{% endblock %}
