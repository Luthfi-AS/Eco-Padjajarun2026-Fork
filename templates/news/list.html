{% extends "base.html" %}{% block content %}
<section class="page-header">
  <h1>News Page</h1>
  <p>Update resmi Eco Padjadjarun 2026.</p>
</section>
<section class="section grid three">
  {% for article in articles %}<a
    class="card link-card"
    href="{{ article.get_absolute_url }}"
    ><small>{{ article.category }}</small>
    <h3>{{ article.title }}</h3>
    <p>{{ article.excerpt }}</p></a
  >{% endfor %}
</section>
{% endblock %}
